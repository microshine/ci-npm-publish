name: Publish

on:
  push:
    branches:
      - main
  # Retry publishing from the v<version> release tag after a failed publish.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # Check the commit before release-please can create a tag or GitHub Release.
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify
        uses: ./.github/actions/verify

  release-please:
    runs-on: ubuntu-24.04
    needs: check

    permissions:
      contents: write
      issues: write
      pull-requests: write

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Set RELEASE_TOKEN (PAT or GitHub App token) so Test runs on the release PR.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          target-branch: main

  publish:
    runs-on: ubuntu-24.04
    needs: release-please
    # Manual runs skip check and release-please; explicitly allow their skipped results.
    if: >-
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        needs.release-please.outputs.release_created == 'true'
      )
    permissions:
      contents: write
      packages: write
    steps:
      - name: Verify the release commit
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF_TYPE" != tag ] || [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Run Publish from a v<version> release tag, not from $GITHUB_REF_NAME"
              exit 1
            fi
          elif [ "$RELEASE_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Release commit $RELEASE_SHA differs from $GITHUB_SHA; run Publish manually from the release tag"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Read the version
        run: |
          VERSION=$(node -p "require('./package.json').version")

          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::package.json version $VERSION does not match tag $GITHUB_REF_NAME"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Verify
        id: verify
        uses: ./.github/actions/verify
        with:
          registry-url: https://npm.pkg.github.com

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          PACKAGE_TARBALL: ${{ steps.verify.outputs.tarball }}
          PACKAGE_INTEGRITY: ${{ steps.verify.outputs.integrity }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";

          const integrity = "sha512-" + createHash("sha512")
            .update(readFileSync(process.env.PACKAGE_TARBALL)).digest("base64");
          assert.equal(integrity, process.env.PACKAGE_INTEGRITY, "The checked tarball must not change before publishing");
          NODE

          NAME=$(node -p "require('./package.json').name")

          if npm view "$NAME@$VERSION" version --json --registry=https://npm.pkg.github.com \
            > "$RUNNER_TEMP/package-version.json" 2> "$RUNNER_TEMP/package-version.log"; then
            echo "$NAME@$VERSION is already published"
          elif jq -e '.error.code == "E404"' "$RUNNER_TEMP/package-version.json" > /dev/null; then
            # Publish the exact archive installed and tested above, without packing or rebuilding it.
            npm publish "$PACKAGE_TARBALL" --ignore-scripts --registry=https://npm.pkg.github.com
          else
            cat "$RUNNER_TEMP/package-version.log"
            echo "::error::Cannot check the package version in GitHub Packages"
            exit 1
          fi

      # Retrying an older version must not move the major tag backwards.
      - name: Move major tag
        run: |
          MAJOR="v${VERSION%%.*}"
          LATEST=$(git ls-remote --tags --refs origin "refs/tags/$MAJOR.*" \
            | sed 's|.*refs/tags/||' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1)

          if [ "$LATEST" != "v$VERSION" ]; then
            echo "Leaving $MAJOR unchanged: v$VERSION is not the latest release ($LATEST)"
            exit 0
          fi

          git tag -f "$MAJOR" HEAD
          git push -f origin "$MAJOR"
